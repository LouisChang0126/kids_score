<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/7.15.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.14.6/firebase-firestore.js"></script>
    <title>北區會堂兒崇點數系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="normal.css">
    <style>
        /* Action section card */
        .action-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }

        .action-card-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-sub);
            letter-spacing: .5px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .action-row .button,
        .action-full .button {
            width: 100%;
            font-size: 15px;
        }

        .action-full {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Group switch row */
        .switch-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .switch-row .button {
            font-size: 15px;
            width: 100%;
        }

        /* Care system */
        .care-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .care-header {
            padding: 14px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }

        .care-body {
            padding: 4px 0;
        }

        .care-line {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 13px 20px;
            border-bottom: 1px solid var(--surface);
            font-size: 15px;
        }

        .care-line:last-child {
            border-bottom: none;
        }

        .care-week {
            font-weight: 700;
            min-width: 92px;
            color: var(--primary);
            font-size: 13px;
        }

        .care-names {
            color: var(--text-main);
            flex: 1;
            font-size: 15px;
        }

        .care-empty {
            padding: 32px 20px;
            text-align: center;
            color: var(--text-sub);
            font-size: 14px;
        }

        /* Attendance table */
        .attend-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .attend-header {
            padding: 14px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }

        .attend-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .attend-table {
            border-collapse: collapse;
            width: 100%;
            min-width: 480px;
        }

        .attend-table th {
            background: var(--surface);
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sub);
            padding: 8px 0px;
            border-bottom: 1px solid var(--border);
            text-align: center;
            white-space: nowrap;
        }

        /* Name column fixed */
        .attend-table th:first-child,
        .attend-table td:first-child {
            width: 55px;
            box-sizing: border-box;
            text-align: left;
            font-weight: 600;
            padding-left: 2px;
            white-space: nowrap;
            background: var(--bg);
            position: sticky;
            left: 0;
            z-index: 1;
        }

        .attend-table td {
            padding: 2px 0px;
            border-bottom: 1px solid var(--surface);
            text-align: center;
            vertical-align: middle;
        }

        .attend-table tr:last-child td {
            border-bottom: none;
        }

        .attend-table td.name-cell {
            font-size: 14px;
            color: var(--text-main);
        }

        /* Dot cell */
        .dot {
            display: inline-block;
            width: 26px;
            height: 26px;
            border-radius: 6px;
        }

        .dot.present {
            background: #4ADE80;
        }

        /* green */
        .dot.absent {
            background: #E5E7EB;
        }

        /* light grey */
        .dot.no-data {
            background: #E5E7EB;
            opacity: .45;
        }

        /* faded grey = no doc */

        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px;
            color: var(--text-sub);
            font-size: 14px;
            gap: 10px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <div id="sys-title">北區會堂兒崇</div>
        <ul>
            <li><a href="#" id="signinLink">✅ 簽到</a></li>
            <li><a href="#" id="scoreLink">⭐ 加分</a></li>
            <li><a href="#" id="newFriendLink">🌟 新朋友</a></li>
            <li class="is-active"><a href="#" id="managerLink">⚙️ 管理員</a></li>
        </ul>
    </div>

    <div class="content">
        <div>
            <div class="section-title">管理員工具</div>
            <div class="section-sub" id="group-label"></div>
        </div>

        <!-- Switch Group -->
        <div class="action-card">
            <div class="action-card-title">切換組別</div>
            <div class="switch-row">
                <button id="big-btn" class="button red" onclick="change_login_group('大寶')">大寶</button>
                <button id="mid-btn" class="button blue" onclick="change_login_group('中寶')">中寶</button>
                <button id="sml-btn" class="button green" onclick="change_login_group('小寶')">小寶</button>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="action-card">
            <div class="action-card-title">管理功能</div>
            <div class="action-row">
                <button class="button brown" onclick="go_to_shop()">🛍️ 換點數（扣點）</button>
                <button class="button purple" onclick="go_to_upgrade()">🎓 兒童升降級</button>
            </div>
        </div>

        <!-- Care System -->
        <div class="care-card">
            <div class="care-header">❤️ 關懷系統 — <span id="care-group-label"></span></div>
            <div class="care-body" id="care_system">
                <div class="loader">
                    <div class="spinner"></div> 計算出席紀錄中…
                </div>
            </div>
        </div>

        <!-- Attendance Table -->
        <div class="attend-card">
            <div class="attend-header">📋 出席狀況 — <span id="attend-group-label"></span></div>
            <div class="attend-wrap">
                <div class="loader" id="attend-loader">
                    <div class="spinner"></div> 載入出席資料…
                </div>
                <table class="attend-table" id="attend-table" style="display:none">
                    <thead id="attend-thead"></thead>
                    <tbody id="attend-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="init_firestore.js"></script>
    <script>
        const today = new Date().toISOString().slice(2, 10).replace(/-/g, '');
        const urlParams = new URLSearchParams(window.location.search);
        const group = urlParams.get('group');

        function parameter() {
            document.getElementById("signinLink").href = "signin.html?group=" + group;
            document.getElementById("scoreLink").href = "score.html?group=" + group;
            document.getElementById("newFriendLink").href = "newfriend.html?group=" + group;
            document.getElementById("group-label").textContent = `目前組別：${group}`;
            document.getElementById("care-group-label").textContent = group;
            document.getElementById("attend-group-label").textContent = group;
        }

        document.addEventListener("DOMContentLoaded", async function () {
            if (!group || group === "null") { window.location.href = "index.html"; return; }
            if (group === "大寶") document.getElementById("big-btn").hidden = true;
            else if (group === "中寶") document.getElementById("mid-btn").hidden = true;
            else document.getElementById("sml-btn").hidden = true;
            parameter();
            load_care();
            load_attendance();
        });

        function change_login_group(g) { window.location.href = "manager.html?group=" + g; }
        function go_to_shop() { window.location.href = "shop.html?group=" + group; }
        function go_to_upgrade() { window.location.href = "upgrade.html?group=" + group; }

        /* ── 計算最近 8 個周日的日期物件（最新的排在 index 0）──────── */
        function get_last_8_sundays() {
            const t = new Date();
            const dow = t.getDay();          // 0=Sun, 1=Mon…
            // 如果今天是周日 (0) 則 offset=0；否則往回到上個周日
            const daysToLastSun = dow;       // if dow==0 → 0 offset (today itself)
            const sundays = [];
            for (let i = 0; i < 8; i++) {
                const d = new Date(t);
                d.setDate(t.getDate() - daysToLastSun - 7 * i);
                sundays.push(d);
            }
            return sundays; // [最近周日, 前1周, …, 前7周]
        }

        /* 把 Date 轉成 YYMMDD 字串 */
        function date_to_key(d) {
            return d.toISOString().slice(2, 10).replace(/-/g, '');
        }

        /* 把 Date 轉成好讀的月/日 */
        function date_to_label(d) {
            return `${d.getMonth() + 1}/${d.getDate()}`;
        }

        /* ── 舊版關懷系統  ────────────────────────────────────────── */
        function get_sunday_format(week_before) {
            const sundays = get_last_8_sundays();
            return date_to_key(sundays[week_before]);
        }

        async function load_kids_care() {
            var students = {};
            const snap = await db.collection('kids').where('group', '==', group).get();
            if (!snap.empty) snap.forEach(doc => { students[doc.id] = -1; });
            return students;
        }

        async function load_care() {
            const kids = await load_kids_care();
            const careEl = document.getElementById("care_system");
            const chinese = ['一', '二', '三', '四', '五', '六', '七', '八'];
            let breakpoint = 8;

            for (let i = 0; i < 8; i++) {
                const snap = await db.collection(group).doc(get_sunday_format(i)).get();
                if (snap.exists) {
                    Object.keys(snap.data()).forEach(k => { if (kids[k] === -1) kids[k] = i; });
                } else { breakpoint = i; break; }
            }

            careEl.innerHTML = '';
            let hasAny = false;

            for (let i = 0; i < Math.max(...Object.values(kids)); i++) {
                const arr = Object.entries(kids).filter(([, v]) => v === i + 1).map(([k]) => k);
                if (arr.length) {
                    hasAny = true;
                    careEl.innerHTML += `
                        <div class="care-line">
                            <span class="care-week">${chinese[i]}週未出現</span>
                            <span class="care-names">${arr.join('、')}</span>
                        </div>`;
                }
            }
            if (breakpoint > 0) {
                const arr = Object.entries(kids).filter(([, v]) => v === -1).map(([k]) => k);
                if (arr.length) {
                    hasAny = true;
                    careEl.innerHTML += `
                        <div class="care-line">
                            <span class="care-week">${chinese[breakpoint - 1]}週以上</span>
                            <span class="care-names">${arr.join('、')}</span>
                        </div>`;
                }
            }
            if (!hasAny) {
                careEl.innerHTML = '<div class="care-empty">🎉 本組近期出席狀況良好！</div>';
            }
        }

        /* ── 出席狀況表  ──────────────────────────────────────────── */
        async function load_attendance() {
            const sundays = get_last_8_sundays();   // 最新週在前

            // 轉成「最舊 → 最新」排列，方便表格由左到右
            const weeks = sundays.slice().reverse();  // [7週前, …, 最近周日]

            // 計算查詢區間：最舊周日 ~ 最新周日（YYMMDD 字串）
            const startKey = date_to_key(weeks[0]);
            const endKey = date_to_key(weeks[weeks.length - 1]);

            // 用 where 抓範圍內的文件
            let docs = {}; // { 'YYMMDD': Set<studentName> }

            try {
                const snap = await db.collection(group)
                    .where(firebase.firestore.FieldPath.documentId(), '>=', startKey)
                    .where(firebase.firestore.FieldPath.documentId(), '<=', endKey)
                    .get();

                snap.forEach(doc => {
                    docs[doc.id] = new Set(Object.keys(doc.data()));
                });
            } catch (e) {
                console.error('出席狀況查詢失敗', e);
            }

            // 取得所有學生名單（已排序）
            const kidsSnap = await db.collection('kids').where('group', '==', group).get();
            const students = [];
            kidsSnap.forEach(doc => students.push(doc.id));
            students.sort((a, b) => a.localeCompare(b));

            // ── 建立 Table Header ──────────────────────────────────
            const thead = document.getElementById('attend-thead');
            const tr_head = document.createElement('tr');
            // 第一欄：名字
            const th_name = document.createElement('th');
            th_name.textContent = '姓名';
            tr_head.appendChild(th_name);
            // 每週欄位
            weeks.forEach(d => {
                const th = document.createElement('th');
                th.textContent = date_to_label(d);
                tr_head.appendChild(th);
            });
            thead.appendChild(tr_head);

            // ── 建立 Table Body ────────────────────────────────────
            const tbody = document.getElementById('attend-tbody');

            students.forEach(name => {
                const tr = document.createElement('tr');

                // 名字格
                const td_name = document.createElement('td');
                td_name.className = 'name-cell';
                td_name.textContent = name;
                tr.appendChild(td_name);

                // 每週格
                weeks.forEach(d => {
                    const key = date_to_key(d);
                    const td = document.createElement('td');
                    const dot = document.createElement('span');

                    if (!(key in docs)) {
                        // 整週無資料（document 不存在）
                        dot.className = 'dot no-data';
                        dot.title = '本週無點名資料';
                    } else if (docs[key].has(name)) {
                        dot.className = 'dot present';
                        dot.title = '有出席';
                    } else {
                        dot.className = 'dot absent';
                        dot.title = '未出席';
                    }

                    td.appendChild(dot);
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });

            // 顯示表格
            document.getElementById('attend-loader').style.display = 'none';
            document.getElementById('attend-table').style.display = '';
        }
    </script>
</body>

</html>
