<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/7.15.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.14.6/firebase-firestore.js"></script>
    <title>北區會堂兒崇點數系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="normal.css">
    <style>
        /* Action section card */
        .action-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }
        .action-card-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-sub);
            letter-spacing: .5px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .action-row .button,
        .action-full .button {
            width: 100%;
            font-size: 15px;
        }
        .action-full {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Group switch row */
        .switch-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .switch-row .button { font-size: 15px; width: 100%; }

        /* Care system */
        .care-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .care-header {
            padding: 14px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }
        .care-body {
            padding: 4px 0;
        }
        .care-line {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 13px 20px;
            border-bottom: 1px solid var(--surface);
            font-size: 15px;
        }
        .care-line:last-child { border-bottom: none; }
        .care-week {
            font-weight: 700;
            min-width: 92px;
            color: var(--primary);
            font-size: 13px;
        }
        .care-names {
            color: var(--text-main);
            flex: 1;
            font-size: 15px;
        }
        .care-empty {
            padding: 32px 20px;
            text-align: center;
            color: var(--text-sub);
            font-size: 14px;
        }
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px;
            color: var(--text-sub);
            font-size: 14px;
            gap: 10px;
        }
        .spinner {
            width: 20px; height: 20px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body>
    <div class="header">
        <div id="sys-title">北區會堂兒崇</div>
        <ul>
            <li><a href="#" id="signinLink">✅ 簽到</a></li>
            <li><a href="#" id="scoreLink">⭐ 加分</a></li>
            <li><a href="#" id="newFriendLink">🌟 新朋友</a></li>
            <li class="is-active"><a href="#" id="managerLink">⚙️ 管理員</a></li>
        </ul>
    </div>

    <div class="content">
        <div>
            <div class="section-title">管理員工具</div>
            <div class="section-sub" id="group-label"></div>
        </div>

        <!-- Switch Group -->
        <div class="action-card">
            <div class="action-card-title">切換組別</div>
            <div class="switch-row">
                <button id="big-btn" class="button red" onclick="change_login_group('大寶')">大寶</button>
                <button id="mid-btn" class="button blue" onclick="change_login_group('中寶')">中寶</button>
                <button id="sml-btn" class="button green" onclick="change_login_group('小寶')">小寶</button>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="action-card">
            <div class="action-card-title">管理功能</div>
            <div class="action-row">
                <button class="button brown" onclick="go_to_shop()">🛍️ 換點數（扣點）</button>
                <button class="button purple" onclick="go_to_upgrade()">🎓 兒童升降級</button>
            </div>
        </div>

        <!-- Care System -->
        <div class="care-card">
            <div class="care-header">❤️ 關懷系統 — <span id="care-group-label"></span></div>
            <div class="care-body" id="care_system">
                <div class="loader"><div class="spinner"></div> 計算出席紀錄中…</div>
            </div>
        </div>
    </div>

    <script src="init_firestore.js"></script>
    <script>
        const today = new Date().toISOString().slice(2, 10).replace(/-/g, '');
        const urlParams = new URLSearchParams(window.location.search);
        const group = urlParams.get('group');

        function parameter() {
            document.getElementById("signinLink").href = "signin.html?group=" + group;
            document.getElementById("scoreLink").href = "score.html?group=" + group;
            document.getElementById("newFriendLink").href = "newfriend.html?group=" + group;
            document.getElementById("group-label").textContent = `目前組別：${group}`;
            document.getElementById("care-group-label").textContent = group;
        }

        document.addEventListener("DOMContentLoaded", async function () {
            if (!group || group === "null") { window.location.href = "index.html"; return; }
            if (group === "大寶") document.getElementById("big-btn").hidden = true;
            else if (group === "中寶") document.getElementById("mid-btn").hidden = true;
            else document.getElementById("sml-btn").hidden = true;
            parameter();
            load_care();
        });

        function change_login_group(g) { window.location.href = "manager.html?group=" + g; }
        function go_to_shop()    { window.location.href = "shop.html?group=" + group; }
        function go_to_upgrade() { window.location.href = "upgrade.html?group=" + group; }

        function get_sunday_format(week_before) {
            const t = new Date();
            const dow = t.getDay();
            const last = new Date(t);
            last.setDate(t.getDate() - dow - 7 * week_before);
            return last.toISOString().slice(2, 10).replace(/-/g, '');
        }

        async function load_kids() {
            var students = {};
            const snap = await db.collection('kids').where('group', '==', group).get();
            if (!snap.empty) snap.forEach(doc => { students[doc.id] = -1; });
            return students;
        }

        async function load_care() {
            const kids = await load_kids();
            const careEl = document.getElementById("care_system");
            const chinese = ['一', '二', '三', '四', '五', '六', '七', '八'];
            let breakpoint = 8;

            for (let i = 0; i < 8; i++) {
                const snap = await db.collection(group).doc(get_sunday_format(i)).get();
                if (snap.exists) {
                    Object.keys(snap.data()).forEach(k => { if (kids[k] === -1) kids[k] = i; });
                } else { breakpoint = i; break; }
            }

            careEl.innerHTML = '';
            let hasAny = false;

            for (let i = 0; i < Math.max(...Object.values(kids)); i++) {
                const arr = Object.entries(kids).filter(([, v]) => v === i + 1).map(([k]) => k);
                if (arr.length) {
                    hasAny = true;
                    careEl.innerHTML += `
                        <div class="care-line">
                            <span class="care-week">${chinese[i]}週未出現</span>
                            <span class="care-names">${arr.join('、')}</span>
                        </div>`;
                }
            }
            if (breakpoint > 0) {
                const arr = Object.entries(kids).filter(([, v]) => v === -1).map(([k]) => k);
                if (arr.length) {
                    hasAny = true;
                    careEl.innerHTML += `
                        <div class="care-line">
                            <span class="care-week">${chinese[breakpoint - 1]}週以上</span>
                            <span class="care-names">${arr.join('、')}</span>
                        </div>`;
                }
            }
            if (!hasAny) {
                careEl.innerHTML = '<div class="care-empty">🎉 本組近期出席狀況良好！</div>';
            }
        }
    </script>
</body>

</html>
