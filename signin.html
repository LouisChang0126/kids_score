<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/7.15.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.14.6/firebase-firestore.js"></script>
    <title>北區會堂兒崇點數系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="normal.css">
    <style>
        /* 全員到場 banner */
        #students-all-arrive .all-here {
            text-align: center;
            padding: 48px 24px;
            color: #10B981;
            font-size: 24px;
            font-weight: 700;
        }

        /* 組別 section 標題 */
        .group-header {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .7px;
            text-transform: uppercase;
            color: var(--text-sub);
            margin: 20px 0 10px;
        }

        .group-header:first-child {
            margin-top: 0;
        }

        /* 點名按鈕 */
        .group .button {
            font-size: 20px;
            font-weight: 600;
            height: 56px;
            border-radius: 10px;
        }

        /* loading spinner */
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
            color: var(--text-sub);
            font-size: 15px;
            gap: 10px;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <div id="sys-title">北區會堂兒崇</div>
        <ul>
            <li class="is-active"><a href="#" id="signinLink">✅ 簽到</a></li>
            <li><a href="#" id="scoreLink">⭐ 加分</a></li>
            <li><a href="#" id="newFriendLink">🌟 新朋友</a></li>
            <li><a href="#" id="managerLink">⚙️ 管理員</a></li>
        </ul>
    </div>

    <div class="content">
        <div>
            <div class="section-title">今日點名</div>
            <div class="section-sub" id="date-label"></div>
        </div>

        <div id="students-all-arrive"></div>

        <div id="group-big-wrap" style="display:none">
            <div class="group-header">🔴 大寶</div>
            <div class="group" id="group-big"></div>
        </div>

        <div id="group-medium-wrap" style="display:none">
            <div class="group-header">🔵 中寶</div>
            <div class="group" id="group-medium"></div>
        </div>

        <div id="group-small-wrap" style="display:none">
            <div class="group-header">🟢 小寶</div>
            <div class="group" id="group-small"></div>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div> 載入中…
        </div>
    </div>

    <script src="init_firestore.js"></script>
    <script>
        const today = new Date().toISOString().slice(2, 10).replace(/-/g, '');
        const urlParams = new URLSearchParams(window.location.search);
        const group = urlParams.get('group');

        // Show today's date nicely
        const d = new Date();
        document.getElementById('date-label').textContent =
            `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;

        async function load_signin() {
            var students = [];
            const group_name = ['小寶', '中寶', '大寶'];
            for (let g of group_name) {
                const snapshot = await db.collection(g).doc(today).get();
                if (snapshot.exists) {
                    students = students.concat(Object.keys(snapshot.data()));
                }
            }
            return students;
        }

        async function load_all_students() {
            let students = {};
            const snapshot = await db.collection('kids').get();
            snapshot.forEach(doc => {
                students[doc.id] = doc.data()['group'];
            });
            return students;
        }

        function createButton(studentNames) {
            document.getElementById('loader').style.display = 'none';
            const studentsDiv = document.getElementById('students-all-arrive');
            studentsDiv.innerHTML = '';

            if (Object.keys(studentNames).length === 0) {
                studentsDiv.innerHTML = '<div class="all-here">🎉 大家都到囉！</div>';
                return;
            }

            // Show wrappers
            const bigWrap = document.getElementById('group-big-wrap');
            const midWrap = document.getElementById('group-medium-wrap');
            const smlWrap = document.getElementById('group-small-wrap');

            Object.entries(studentNames).forEach(([name, grp]) => {
                const btn = document.createElement('button');
                if (grp === '大寶') {
                    colorClass = 'red';
                    targetDiv = document.getElementById('group-big');
                    wrap = bigWrap;
                } else if (grp === '中寶') {
                    colorClass = 'blue';
                    targetDiv = document.getElementById('group-medium');
                    wrap = midWrap;
                } else if (grp === '小寶') {
                    colorClass = 'green';
                    targetDiv = document.getElementById('group-small');
                    wrap = smlWrap;
                } else {
                    return; // 忽略「隱藏」、「新世代」或其他不相關組別
                }

                btn.className = `button ${colorClass}`;
                btn.textContent = name;
                wrap.style.display = 'block';

                btn.onclick = async () => {
                    btn.disabled = true;
                    btn.style.opacity = '.5';
                    const data = {
                        point: 0, ontime: false, seat: false,
                        small_group: false, praise: false, addition: 0
                    };
                    await db.collection(grp).doc(today).set({ [name]: data }, { merge: true });
                    btn.remove();
                    // Hide wrapper if empty
                    if (targetDiv.children.length === 0) wrap.style.display = 'none';
                };

                targetDiv.appendChild(btn);
            });
        }

        async function getDifference() {
            const allStudents = await load_all_students();
            const SigninStudents = await load_signin();
            SigninStudents.forEach(s => delete allStudents[s]);
            return allStudents;
        }

        function parameter() {
            document.getElementById("scoreLink").href = "score.html?group=" + group;
            document.getElementById("newFriendLink").href = "newfriend.html?group=" + group;
            document.getElementById("managerLink").href = "manager.html?group=" + group;
        }

        document.addEventListener("DOMContentLoaded", async function () {
            if (!group || group === "null") {
                window.location.href = "index.html";
                return;
            }
            parameter();
            const difference = await getDifference();
            createButton(difference);
        });
    </script>
</body>

</html>
