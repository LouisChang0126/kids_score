<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/7.15.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.14.6/firebase-firestore.js"></script>
    <title>北區會堂兒崇點數系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="normal.css">
    <style>
        /* Score cards — stack vertically on mobile, each student is a card */
        .student-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .student-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .student-name {
            font-size: 20px;
            font-weight: 700;
        }
        .score-pills {
            display: flex;
            gap: 8px;
        }
        .score-pill {
            font-size: 13px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 999px;
            background: var(--surface);
            color: var(--text-sub);
            white-space: nowrap;
        }
        .score-pill.today {
            background: #FFF0F0;
            color: var(--primary);
        }

        /* Seal row */
        .seal-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .seal-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            padding: 8px 4px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            background: var(--surface);
            transition: background .2s, border-color .2s, transform .1s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .seal-cell:active { transform: scale(.95); }
        .seal-cell.active {
            background: #FFF0F0;
            border-color: var(--primary);
        }
        .seal-cell img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            opacity: .25;
            transition: opacity .2s;
        }
        .seal-cell.active img { opacity: 1; }
        .seal-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sub);
            text-align: center;
        }
        .seal-cell.active .seal-label { color: var(--primary); }
        .seal-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 1px 6px;
            background: #DDDDDD;
            border-radius: 999px;
            color: #555;
        }
        .seal-cell.active .seal-badge {
            background: var(--primary);
            color: #fff;
        }

        /* Extra points row */
        .extra-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .extra-row label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            white-space: nowrap;
        }
        .extra-row input {
            width: 90px;
            padding: 8px 12px;
            font-size: 16px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            text-align: center;
        }

        /* Loader */
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
            color: var(--text-sub);
            font-size: 15px;
            gap: 10px;
        }
        .spinner {
            width: 22px; height: 22px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body>
    <div class="header">
        <div id="sys-title">北區會堂兒崇</div>
        <ul>
            <li><a href="#" id="signinLink">✅ 簽到</a></li>
            <li class="is-active"><a href="#" id="scoreLink">⭐ 加分</a></li>
            <li><a href="#" id="newFriendLink">🌟 新朋友</a></li>
            <li><a href="#" id="managerLink">⚙️ 管理員</a></li>
        </ul>
    </div>

    <div class="content">
        <div>
            <div class="section-title">加分評分</div>
            <div class="section-sub" id="date-label"></div>
        </div>
        <div id="panel">
            <div class="loader" id="loader">
                <div class="spinner"></div> 載入中…
            </div>
        </div>
    </div>

    <script src="init_firestore.js"></script>
    <script>
        const today = new Date().toISOString().slice(2, 10).replace(/-/g, '');
        const urlParams = new URLSearchParams(window.location.search);
        const group = urlParams.get('group');

        const d = new Date();
        document.getElementById('date-label').textContent =
            `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日 · ${group}`;

        async function load_this_week() {
            var students = [];
            const snapshot = await db.collection(group).doc(today).get();
            if (snapshot.exists) { students = Object(snapshot.data()); }
            return students;
        }

        async function load_kids() {
            var students = {};
            const snapshot = await db.collection('kids').where('group', '==', group).get();
            if (!snapshot.empty) {
                snapshot.forEach(doc => { students[doc.id] = doc.data(); });
            }
            return students;
        }

        function makeSealCell(imgSrc, label, badge, isActive, onToggle) {
            const cell = document.createElement('div');
            cell.className = 'seal-cell' + (isActive ? ' active' : '');

            const img = document.createElement('img');
            img.src = imgSrc;

            const lbl = document.createElement('div');
            lbl.className = 'seal-label';
            lbl.textContent = label;

            const bdg = document.createElement('div');
            bdg.className = 'seal-badge';
            bdg.textContent = badge;

            cell.appendChild(img);
            cell.appendChild(lbl);
            cell.appendChild(bdg);

            cell.onclick = async () => {
                const nowActive = cell.classList.toggle('active');
                await onToggle(nowActive);
            };
            return cell;
        }

        async function creatTable() {
            const signin_week = await load_this_week();
            const signin_user = await load_kids();
            const panel = document.getElementById('panel');
            panel.innerHTML = '';

            if (Object.keys(signin_week).length === 0) {
                alert("今天尚未點名！");
                window.location.href = "signin.html?group=" + group;
                return;
            }

            const sorted = Object.entries(signin_week).sort(([a], [b]) => a.localeCompare(b));

            sorted.forEach(([student, user_data]) => {
                let total_point = signin_user[student]['total_point'];

                const card = document.createElement('div');
                card.className = 'student-card';

                // Header: name + score pills
                const header = document.createElement('div');
                header.className = 'student-card-header';

                const name = document.createElement('div');
                name.className = 'student-name';
                name.textContent = student;

                const pills = document.createElement('div');
                pills.className = 'score-pills';

                const totalPill = document.createElement('div');
                totalPill.className = 'score-pill';
                totalPill.textContent = `累計 ${total_point}`;

                const todayPill = document.createElement('div');
                todayPill.className = 'score-pill today';
                todayPill.textContent = `今日 +${user_data['point']}`;

                pills.appendChild(totalPill);
                pills.appendChild(todayPill);
                header.appendChild(name);
                header.appendChild(pills);
                card.appendChild(header);

                // Seal row
                const sealRow = document.createElement('div');
                sealRow.className = 'seal-row';

                const updateDB = async () => {
                    totalPill.textContent = `累計 ${total_point}`;
                    todayPill.textContent = `今日 +${user_data['point']}`;
                    await db.collection(group).doc(today).update({ [student]: user_data });
                    await db.collection('kids').doc(student).update({ total_point });
                };

                sealRow.appendChild(makeSealCell('image/ontime.png', '準時', '+3', user_data['ontime'], async (active) => {
                    user_data['point'] += active ? 3 : -3;
                    total_point += active ? 3 : -3;
                    user_data['ontime'] = active;
                    await updateDB();
                }));
                sealRow.appendChild(makeSealCell('image/praise.png', '專心敬拜', '+2', user_data['praise'], async (active) => {
                    user_data['point'] += active ? 2 : -2;
                    total_point += active ? 2 : -2;
                    user_data['praise'] = active;
                    await updateDB();
                }));
                sealRow.appendChild(makeSealCell('image/seat.png', '搬椅子', '+1', user_data['seat'], async (active) => {
                    user_data['point'] += active ? 1 : -1;
                    total_point += active ? 1 : -1;
                    user_data['seat'] = active;
                    await updateDB();
                }));
                sealRow.appendChild(makeSealCell('image/small_group.png', '小組討論', '+1', user_data['small_group'], async (active) => {
                    user_data['point'] += active ? 1 : -1;
                    total_point += active ? 1 : -1;
                    user_data['small_group'] = active;
                    await updateDB();
                }));

                card.appendChild(sealRow);

                // Extra points
                const extraRow = document.createElement('div');
                extraRow.className = 'extra-row';

                const extraLabel = document.createElement('label');
                extraLabel.textContent = '額外加點';

                const extraInput = document.createElement('input');
                extraInput.type = 'number';
                extraInput.min = 0; extraInput.max = 100; extraInput.step = 1;
                extraInput.value = user_data['addition'];

                let pre = user_data['addition'];
                extraInput.addEventListener('change', async () => {
                    const diff = Number(extraInput.value) - Number(pre);
                    total_point += diff;
                    user_data['point'] += diff;
                    pre = extraInput.value;
                    user_data['addition'] = extraInput.value;
                    await updateDB();
                });

                extraRow.appendChild(extraLabel);
                extraRow.appendChild(extraInput);
                card.appendChild(extraRow);

                panel.appendChild(card);
            });
        }

        function parameter() {
            document.getElementById("signinLink").href = "signin.html?group=" + group;
            document.getElementById("newFriendLink").href = "newfriend.html?group=" + group;
            document.getElementById("managerLink").href = "manager.html?group=" + group;
        }

        document.addEventListener("DOMContentLoaded", async function () {
            if (!group || group === "null") { window.location.href = "index.html"; return; }
            parameter();
            creatTable();
        });
    </script>
</body>

</html>
