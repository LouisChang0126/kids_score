<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北區會堂兒崇點數系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary: #FF5A5F;
            --bg: #FFFFFF;
            --surface: #F7F7F7;
            --border: #DDDDDD;
            --text-main: #222222;
            --text-sub: #717171;
            --font: 'Inter', 'Noto Sans TC', Arial, sans-serif;
            --radius: 12px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        .header {
            padding: 20px 24px 8px;
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* Main */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px 48px;
            gap: 16px;
        }

        .section-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            letter-spacing: .8px;
            text-transform: uppercase;
            align-self: flex-start;
            width: 100%;
            max-width: 420px;
            margin-bottom: -4px;
        }

        /* Group buttons */
        .group-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            width: 100%;
            max-width: 420px;
            cursor: pointer;
            font-family: var(--font);
            font-size: 20px;
            font-weight: 600;
            color: var(--text-main);
            transition: border-color .2s, box-shadow .2s, transform .1s;
            text-decoration: none;
        }

        .group-btn:hover {
            border-color: var(--primary);
            box-shadow: 0 2px 12px rgba(255, 90, 95, .15);
        }

        .group-btn:active {
            transform: scale(.98);
        }

        .group-btn .badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
            color: #fff;
        }

        .badge.red {
            background: #FF5A5F;
        }

        .badge.blue {
            background: #0EA5E9;
        }

        .badge.green {
            background: #10B981;
        }

        .arrow {
            color: var(--text-sub);
            font-size: 18px;
        }

        /* Divider */
        .divider {
            width: 100%;
            max-width: 420px;
            height: 1px;
            background: var(--border);
            margin: 8px 0;
        }

        /* Footer note */
        .footer-note {
            text-align: center;
            font-size: 13px;
            color: var(--text-sub);
            padding: 12px 24px 28px;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="logo">⛪ 北區會堂兒崇</div>
        <div class="subtitle">點數管理系統</div>
    </div>

    <div class="main">
        <div class="section-label">選擇組別開始</div>

        <button class="group-btn" onclick="signin('大寶')">
            <span>大寶</span>
            <div style="display:flex;align-items:center;gap:10px;">
                <span class="badge red">小四~小六</span>
                <span class="arrow">›</span>
            </div>
        </button>

        <button class="group-btn" onclick="signin('中寶')">
            <span>中寶</span>
            <div style="display:flex;align-items:center;gap:10px;">
                <span class="badge blue">小一~小三</span>
                <span class="arrow">›</span>
            </div>
        </button>

        <button class="group-btn" onclick="signin('小寶')">
            <span>小寶</span>
            <div style="display:flex;align-items:center;gap:10px;">
                <span class="badge green">幼稚園</span>
                <span class="arrow">›</span>
            </div>
        </button>
    </div>

    <div class="footer-note">請選擇對應組別進行今日點名與加分</div>

    <script>
        function signin(group) {
            window.location = "signin.html?group=" + group;
        }
    </script>
</body>

</html>
